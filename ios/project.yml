name: TeslaMirror
options:
  bundleIdPrefix: app.teslamirror
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  Telegraph:
    url: https://github.com/Building42/Telegraph
    exactVersion: 0.40.0
  MirrorCore:
    path: MirrorCore
targets:
  TeslaMirror:
    type: application
    platform: iOS
    sources:
      - TeslaMirror
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teslamirror.ios
        INFOPLIST_FILE: TeslaMirror/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: TeslaMirrorBroadcast
        embed: true
      - package: MirrorCore
  TeslaMirrorBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - TeslaMirrorBroadcast
      - path: ../web/public
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teslamirror.ios.broadcast
        INFOPLIST_FILE: TeslaMirrorBroadcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Telegraph
      - package: MirrorCore
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
